services:
  modbus-frontend:
    # Image name on Docker Hub
    image: nguyenvietanh10326/hotel-modbus-frontend:v11.8
    
    # Allows local building if the image is not found on Hub or for development
    build: 
      context: .
      dockerfile: Dockerfile

    container_name: modbus_frontend_app
    ports:
      # Outer port: 3001, Container port: 3001
      - "3001:3001"
    
    restart: unless-stopped
    
    environment:
      # Environment variables for Runtime injection via entrypoint.sh
      REACT_APP_API_BASE: ${REACT_APP_API_BASE}
      REACT_APP_SOCKET_URL: ${REACT_APP_SOCKET_URL}
